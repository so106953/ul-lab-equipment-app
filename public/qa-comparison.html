<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设计 QA 对比</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; font-family: Arial, "Microsoft YaHei", sans-serif; background: #f0f0f0; }
      h1 { margin: 0 0 18px; font-size: 20px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      figure { margin: 0; background: #fff; padding: 12px; border-radius: 8px; }
      figcaption { font-weight: 700; margin-bottom: 10px; }
      img { width: 100%; height: auto; display: block; }
    </style>
  </head>
  <body>
    <h1>UL 实验室设备管理 - 视觉 QA（桌面状态）</h1>
    <main>
      <figure><figcaption>设计参考</figcaption><img src="/assets/qa-source.png" alt="设计参考" /></figure>
      <figure><figcaption>实现截图</figcaption><img src="/assets/qa-prototype.png" alt="实现截图" /></figure>
    </main>
  </body>
</html>
